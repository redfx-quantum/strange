name: Build with Maven
on:
  push:
    branches: [release]
  pull_request:
    branches: [release]

jobs:
  build:  
    runs-on: ubuntu-latest
    steps:  
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'

      # - name: Setup Java
      #  uses: actions/setup-java@v3
